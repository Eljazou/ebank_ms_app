spring.application.name=ebank-bot
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
discord.token=${Discord_Token}
discord.gateway-intents=MESSAGE_CONTENT
telegram.bot.token=${Telegram_Token:}
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.chat.model=baidu/ernie-5.5-flash-preview:free
spring.cloud.discovery.enabled=true
spring.cloud.config.enabled=false
spring.ai.openai.chat.reasoning-effort=low
server.port=8058
spring.ai.mcp.client.streamable-http.connections.customer.url=http://localhost:8056/mcp
spring.ai.mcp.client.streamable-http.connections.ebank.url=http://localhost:8057/mcp
# Loads OPENROUTER_API_KEY from a local, git-ignored file when the env variable is not set
spring.config.import=optional:classpath:secrets.properties
